<div id="templates-list">
{% if not templates_list %}
  <p style="opacity:.6;">Шаблонов нет — добавь первый сверху.</p>
{% else %}
{% for t in templates_list %}
<details class="rule-row" id="tpl-{{ t.id }}">
  <summary><strong>{{ t.title }}</strong> <small style="opacity:.6;">#{{ t.id }}</small></summary>
  <form hx-post="/templates/{{ t.id }}/edit" hx-target="#templates-list" hx-swap="outerHTML" style="margin-top:.5rem;">
    <input type="text" name="title" value="{{ t.title }}" required title="Изменить название">
    <textarea name="text" rows="3" required title="Изменить текст ответа">{{ t.text }}</textarea>
    <div class="rule-actions">
      <button type="submit" title="Сохранить изменения шаблона">💾 Сохранить</button>
      <button type="button"
              hx-post="/templates/{{ t.id }}/delete"
              hx-target="#templates-list" hx-swap="outerHTML"
              hx-confirm="Удалить шаблон «{{ t.title }}»?"
              title="Удалить шаблон навсегда">🗑️ Удалить</button>
    </div>
  </form>
</details>
{% endfor %}
{% endif %}
</div>
