[project]
name = "aichatpom"
version = "0.1.0"
description = "Локальный агрегатор Telegram-задач (Phase 1: ingest + store)"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "windows-toasts>=1.1.0 ; sys_platform == 'win32'",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.scripts]
aichatpom = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion", "classifier", "web"]

[tool.uv]
package = true
